services:
  java_db:
    image: "postgres:17"
    container_name: "finance_db"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER must be set; see .env.exemplo}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set; see .env.exemplo}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB must be set; see .env.exemplo}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  app:
    build: .
    container_name: finance_app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "${DB_URL:?DB_URL must be set; see .env.exemplo}"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:?POSTGRES_USER must be set; see .env.exemplo}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set; see .env.exemplo}"
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set; see .env.exemplo}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
    depends_on:
      java_db:
          condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
volumes:
  postgres_data: {}

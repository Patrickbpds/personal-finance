spring.application.name=PersonalFinance

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=none

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=finance_tables

jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:24h}
jwt.issuer=personal-finance-app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.login-rate-limit.enabled=${LOGIN_RATE_LIMIT_ENABLED:true}
app.login-rate-limit.max-attempts=${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
app.login-rate-limit.window=${LOGIN_RATE_LIMIT_WINDOW:15m}

app.swagger.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${app.swagger.enabled}
springdoc.swagger-ui.enabled=${app.swagger.enabled}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

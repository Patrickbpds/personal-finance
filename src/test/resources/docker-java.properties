# Testcontainers configures its Docker client through this file.
#
# Docker Engine 29+ refuses clients speaking an API version below 1.40, while
# docker-java (bundled with Testcontainers 1.21.x) otherwise falls back to
# API 1.32 and the daemon answers with HTTP 400 "client version 1.32 is too
# old". Pinning a supported version keeps the discovery working on both local
# machines and CI runners running recent Docker engines.
api.version=1.44
